name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (CPU torch)
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check memoranda scripts tests
      - name: pytest (unit tests; manifest-dependent tests run on committed CSVs)
        run: pytest -q
